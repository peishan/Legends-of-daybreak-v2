<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Legends of Daybreak — Comic Reader</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03050a;color:#f4f0fa;font-family:Nunito,Arial,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid #241f33;background:#080a12;position:sticky;top:0;z-index:5}
.top h1{font-family:Cinzel;font-size:18px;margin:0;font-weight:500}
.top .sub{color:#9a94a6;font-size:12px;margin-top:3px}
.top-btns{display:flex;gap:8px}
.top-btns button{border:1px solid #453a5c;background:#0e0f18;color:#eee;border-radius:7px;padding:9px 13px;cursor:pointer;font-family:Cinzel;font-size:12px}
.top-btns button:hover{border-color:#b76cff}
.stage{display:flex;justify-content:center;padding:18px 12px 100px;background:#03050a}
.stage img{max-width:100%;width:min(900px,100%);border-radius:6px;box-shadow:0 20px 60px #000a;display:block;margin-bottom:14px}
.pagectrl{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;background:linear-gradient(0deg,#060812 60%,transparent);z-index:5}
.pagectrl button{border:1px solid #453a5c;background:#0e0f18;color:#eee;border-radius:8px;padding:11px 18px;cursor:pointer;font-family:Cinzel;font-size:13px}
.pagectrl button:disabled{opacity:.35;cursor:default}
.pagectrl span{font-family:Cinzel;font-size:12px;color:#c8bfe0}
.thumbstrip{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#080a12;border-top:1px solid #201c2c}
.thumbstrip img{height:64px;border-radius:5px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbstrip img.active{border-color:#b76cff}
.empty{padding:60px 20px;text-align:center;color:#9a94a6;font-family:Cinzel}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1 id="chapterTitle">Loading…</h1>
    <div class="sub" id="chapterMeta"></div>
  </div>
  <div class="top-btns">
    <button onclick="window.close()">✕ CLOSE TAB</button>
  </div>
</div>
<div class="stage" id="stage"></div>
<div class="thumbstrip" id="thumbstrip"></div>
<div class="pagectrl">
  <button id="prevBtn">‹ PREV</button>
  <span id="pageLabel"></span>
  <button id="nextBtn">NEXT ›</button>
</div>
<script src="chapters-data.js?v=2026-08-27.2"></script>
<script>
const params = new URLSearchParams(location.search);
const chId = Number(params.get('ch') || 1);
const chapter = CHAPTERS.find(c => c.id === chId);
let pageIndex = 0;

const stage = document.getElementById('stage');
const titleEl = document.getElementById('chapterTitle');
const metaEl = document.getElementById('chapterMeta');
const thumbstrip = document.getElementById('thumbstrip');
const pageLabel = document.getElementById('pageLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render(){
  if(!chapter){
    document.querySelector('.top').style.display='none';
    stage.innerHTML = '<div class="empty">Chapter not found.</div>';
    return;
  }
  titleEl.textContent = `CHAPTER ${String(chapter.id).padStart(2,'0')} · ${chapter.title}`;
  metaEl.textContent = chapter.pageCount > 1 ? `Page ${pageIndex+1} of ${chapter.pageCount}` : 'Single page';
  stage.innerHTML = `<img src="${chapter.pages[pageIndex]}" alt="${chapter.title} page ${pageIndex+1}">`;
  pageLabel.textContent = `${pageIndex+1} / ${chapter.pageCount}`;
  prevBtn.disabled = pageIndex === 0;
  nextBtn.disabled = pageIndex === chapter.pageCount - 1;
  if(chapter.pageCount > 1){
    thumbstrip.innerHTML = chapter.pages.map((p,i)=>`<img src="${p}" class="${i===pageIndex?'active':''}" data-i="${i}">`).join('');
    thumbstrip.querySelectorAll('img').forEach(img=>img.onclick=()=>{pageIndex=Number(img.dataset.i);render();});
  } else {
    thumbstrip.innerHTML = '';
  }
  window.scrollTo({top:0});
}
prevBtn.onclick = ()=>{ if(pageIndex>0){ pageIndex--; render(); } };
nextBtn.onclick = ()=>{ if(chapter && pageIndex<chapter.pageCount-1){ pageIndex++; render(); } };
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') prevBtn.click();
  if(e.key==='ArrowRight') nextBtn.click();
});
render();
</script>
</body>
</html>
