<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daybreak: Story Journey (Prototype)</title>
<style>
:root{--bg:#0f0e17;--card:#1a1925;--hover:#252336;--border:#33304a;--text:#ece9f7;--dim:#9a96b5;--accent:#7c3aed;--accent2:#a78bfa;--gold:#e8c547;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 80px}
h1{font-family:Georgia,serif;font-size:20px;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.obj{border-color:var(--gold);background:linear-gradient(180deg,#2a2412,var(--card))}
.obj .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.obj .t{font-size:17px;font-weight:700;margin:2px 0 4px}.obj .d{font-size:13px;color:var(--dim);margin-bottom:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--hover);color:var(--text);padding:9px 14px;font-weight:600}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;background:#000;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.bar.x i{background:var(--accent2)}
.crew{display:flex;gap:8px;flex-wrap:wrap}.mem{width:64px;text-align:center;font-size:11px}
.mem img,.mem .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;background:var(--hover)}
.ch{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}.ch:first-child{border:0}
.ch .n{width:26px;color:var(--dim);font-size:12px}.ch .m{flex:1}.ch .m small{display:block;color:var(--dim)}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--border);color:var(--dim)}.tag.done{color:var(--green);border-color:var(--green)}.tag.cur{color:var(--gold);border-color:var(--gold)}
.ov{position:fixed;inset:0;z-index:50;display:none;background:#05070c;overflow:auto;padding:14px}.ov.on{display:block}
.shell{max-width:560px;margin:0 auto}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between}
.art{width:100%;max-height:44vh;object-fit:cover;border-radius:12px;border:1px solid var(--border);margin:10px 0;background:#071116}
.say{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;min-height:110px;cursor:pointer}
.say img{width:54px;height:54px;border-radius:50%;object-fit:cover;flex-shrink:0}.who{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);margin-bottom:3px}
.tap{text-align:center;color:var(--gold);font-size:12px;margin-top:10px;opacity:.8}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center}
.modal h2{margin:0 0 8px;color:var(--gold);font-family:Georgia,serif;font-size:18px}.modal p{color:var(--text);margin:0 0 14px;white-space:pre-line}
.foes{display:flex;gap:8px;margin:8px 0}.foe{flex:1;text-align:center;font-size:12px}.foe .face{font-size:30px}.foe img{width:100%;max-height:110px;object-fit:cover;border-radius:10px}
#log{height:110px;overflow:auto;font-size:12px;color:var(--dim);background:#000;border-radius:8px;padding:6px;margin:8px 0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:8px 14px;border-radius:12px;z-index:90;font-size:13px;display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="story"><div class="shell" id="storyShell"></div></div>
<div class="ov" id="fight"><div class="shell" id="fightShell"></div></div>
<div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><p id="mb"></p><button class="go" onclick="closeModal()">Continue</button></div></div>
<div class="toast" id="toast"></div>
<script src="chapters.js"></script>
<script>
/* Prototype: Crimson-Tide-style story journey over Daybreak chapters 1-10.
   Loop per chapter: Objective -> (hunt to level / fight boss) -> Story Mode -> aftermath modal -> next Objective. */
const SAVE_KEY='daybreak_story_journey_proto';
const CREW={Soel:{atk:4,hp:30,role:'Spark'},Joel:{atk:9,hp:90,role:'Shield'},Aisyah:{atk:12,hp:50,role:'Blade'},Eliz:{atk:5,hp:45,role:'Healer'},Mezstorm:{atk:14,hp:55,role:'Storm'}};
// Which chapter's aftermath recruits whom (matches Daybreak's journey data)
const JOINS={1:'Soel',3:'Joel',4:'Aisyah',6:'Eliz',7:'Mezstorm'};
// Gate to START each chapter: a level, or a boss fight BEFORE the aftermath
const BOSSES={8:{name:'Bone Tyrant',icon:'💀',hp:900,atk:34,xp:300,zone:'Cursed Catacombs'},
              9:{name:'Frost Queen',icon:'❄️',img:'../bosses/frostqueen.jpg',hp:1500,atk:46,xp:500,zone:'Frostspire Ruins'},
              10:{name:'Abyssal Leviathan',icon:'🐙',img:'../bosses/abyssalleviathan.jpg',hp:2400,atk:62,xp:800,zone:'Abyssal Depths'}};
const ZONES=[{max:4,n:'Whispering Woods',foes:['Goblin','Wolf','Slime']},{max:9,n:'Cursed Catacombs',foes:['Skeleton','Zombie','Ghost']},{max:13,n:'Crystal Caverns',foes:['Crystal Spider','Gem Golem','Shimmer Bat']},{max:99,n:'Ember Peak',foes:['Fire Imp','Lava Slug','Ash Wraith']}];
const NEED_LV={1:1,2:5,3:8,4:10,5:12,6:14,7:16,8:16,9:18,10:20};

let G=load()||{lvl:1,xp:0,done:{},crew:[],hp:null};
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}
const xpN=()=>30+G.lvl*20, maxHp=()=>90+G.lvl*14, sanAtk=()=>8+G.lvl*2;
const nextCh=()=>CHAPTERS.find(c=>!G.done[c.id]);
const portrait=n=>n==='Narrator'?'':'<img src="../portraits/'+(n==='San'?'san':n.toLowerCase().replace(/[\s.]/g,''))+'.jpg" onerror="this.remove()" alt="">';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

/* ---------- Objective: single source of truth for "what next" ---------- */
function objective(){
  const c=nextCh(); if(!c) return {kind:'end',title:'Chapters 1–10 complete',desc:'The prototype ends here. Your crew: '+(G.crew.join(', ')||'—')+'.'};
  if(G.lvl<NEED_LV[c.id]) return {kind:'level',ch:c,title:'Reach Level '+NEED_LV[c.id],desc:'Hunt in '+zone().n+' to prepare for Chapter '+c.id+': '+c.title+'.',btn:'Hunt ('+zone().n+')'};
  if(BOSSES[c.id]&&!G.read?.[c.id]) return {kind:'read',ch:c,title:'Chapter '+c.id+': '+c.title,desc:c.summary,btn:'Read story'};
  if(BOSSES[c.id]) return {kind:'boss',ch:c,title:'Face the '+BOSSES[c.id].name,desc:'Travel to '+BOSSES[c.id].zone+' and fight.',btn:'Fight '+BOSSES[c.id].name};
  return {kind:'read',ch:c,title:'Chapter '+c.id+': '+c.title,desc:c.summary,btn:'Read story'};
}
function zone(){return ZONES.find(z=>G.lvl<=z.max)}

/* ---------- Home ---------- */
function render(){
  const o=objective(),a=document.getElementById('app');
  let h='<h1>Legends of Daybreak</h1><div class="sub">Story Journey · prototype · chapters 1–10</div>';
  h+='<div class="panel obj"><div class="k">Objective</div><div class="t">'+o.title+'</div><div class="d">'+o.desc+'</div>';
  if(o.btn)h+='<button class="go" onclick="act()">'+o.btn+'</button>';
  h+='</div>';
  h+='<div class="panel"><div class="row" style="justify-content:space-between"><b>San · Lv '+G.lvl+'</b><span class="sub" style="margin:0">'+G.xp+' / '+xpN()+' XP</span></div><div class="bar x" style="margin:6px 0 10px"><i style="width:'+(G.xp/xpN()*100)+'%"></i></div><div class="crew">'+
    ['San'].concat(G.crew).map(n=>'<div class="mem">'+(portrait(n)||'')+'<div>'+n+'</div></div>').join('')+'</div></div>';
  h+='<div class="panel"><b>Story</b>';
  for(const c of CHAPTERS){const d=G.done[c.id],cur=nextCh()===c;
    h+='<div class="ch"><div class="n">'+c.id+'</div><div class="m">'+c.icon+' '+c.title+'<small>'+(d?'Complete':cur?'Current':'Locked')+'</small></div>'+
      (d?'<button onclick="openStory('+c.id+',true)">Replay</button>':'<span class="tag '+(cur?'cur':'')+'">'+(cur?'Next':'🔒')+'</span>')+'</div>';}
  h+='</div><div style="text-align:center"><button onclick="if(confirm(\'Reset prototype save?\')){localStorage.removeItem(SAVE_KEY);location.reload()}">Reset</button></div>';
  a.innerHTML=h;
}
function act(){const o=objective();
  if(o.kind==='level')startFight(false); else if(o.kind==='boss')startFight(true); else if(o.kind==='read')openStory(o.ch.id,false);}

/* ---------- Story Mode (full-screen, tap to advance) ---------- */
let S=null;
function openStory(id,replay){S={c:CHAPTERS.find(c=>c.id===id),i:0,replay};document.getElementById('story').classList.add('on');paintStory()}
function paintStory(){
  const c=S.c,s=c.scenes[S.i],last=S.i===c.scenes.length-1;
  document.getElementById('storyShell').innerHTML='<div class="kick"><span>Chapter '+c.id+' · '+c.title+'</span><span>'+(S.i+1)+' / '+c.scenes.length+'</span></div>'+
   (c.art?'<img class="art" src="../story-art/'+c.art+'" onerror="this.remove()" alt="">':'')+
   '<div class="say" onclick="advStory()">'+portrait(s.speaker)+'<div><div class="who">'+s.speaker+'</div><div>'+s.text+'</div></div></div>'+
   '<div class="tap">'+(last?'Tap to finish':'Tap to continue ▸')+'</div><div class="row" style="justify-content:center;margin-top:12px"><button onclick="closeStory()">Close</button></div>';
  scrollTo(0,0);
}
function advStory(){if(S.i<S.c.scenes.length-1){S.i++;paintStory();return}
  const id=S.c.id,rep=S.replay;closeStory();if(rep)return;
  if(BOSSES[id]&&!G.read?.[id]){G.read=G.read||{};G.read[id]=true;save();render();toast('Story read — the fight awaits');return}
  completeChapter(id)}
function closeStory(){document.getElementById('story').classList.remove('on');S=null;render()}

/* ---------- Modal queue (aftermath, recruits, level-ups play one after another) ---------- */
const Q=[];let modalOpen=false;
function queue(t,b){Q.push([t,b]);if(!modalOpen)nextModal()}
function nextModal(){const m=Q.shift();if(!m){modalOpen=false;return}modalOpen=true;mt.textContent=m[0];mb.textContent=m[1];document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on');setTimeout(nextModal,200)}

function gainXp(x){G.xp+=x;let ups=0;while(G.xp>=xpN()){G.xp-=xpN();G.lvl++;ups++}if(ups)queue('Level Up!','San is now Level '+G.lvl+'.')}
function completeChapter(id){
  const c=CHAPTERS.find(x=>x.id===id);G.done[id]=true;
  const bossXp=BOSSES[id]?0:100+id*40;gainXp(bossXp);
  const j=JOINS[id];let txt='Chapter '+id+' complete.'+(bossXp?'\n+'+bossXp+' XP':'');
  queue(c.title,txt);
  if(j&&!G.crew.includes(j)){G.crew.push(j);queue(j+' joins your crew!',CREW[j].role+' · ATK '+CREW[j].atk+' · HP '+CREW[j].hp)}
  const n=nextCh();queue('New Objective',n?'Next: Chapter '+n.id+' — '+n.title:'You have reached the end of the prototype.');
  save();render()}

/* ---------- Fight (hunt for XP, or boss) ---------- */
let F=null;
function startFight(boss){
  const o=objective();let foes;
  if(boss){const b=BOSSES[o.ch.id];foes=[{n:b.name,icon:b.icon,img:b.img,hp:b.hp,mhp:b.hp,atk:b.atk,xp:b.xp,boss:true}]}
  else{const z=zone();foes=[0,1].map(()=>{const n=z.foes[Math.random()*3|0],hp=30+G.lvl*14;return{n,icon:'👹',hp,mhp:hp,atk:5+G.lvl*2.2,xp:15+G.lvl*5}})}
  const party=[{n:'San',hp:maxHp(),mhp:maxHp(),atk:sanAtk()}].concat(G.crew.map(n=>({n,hp:CREW[n].hp+G.lvl*4,mhp:CREW[n].hp+G.lvl*4,atk:CREW[n].atk+G.lvl})));
  F={foes,party,boss,ch:o.ch,log:['Battle begins!'],over:false};document.getElementById('fight').classList.add('on');paintFight()}
function paintFight(){
  const f=F;document.getElementById('fightShell').innerHTML='<div class="kick"><span>'+(f.boss?'Boss Battle':'Hunt')+'</span><span>'+zone().n+'</span></div>'+
   '<div class="foes">'+f.foes.map(x=>'<div class="foe">'+(x.img?'<img src="'+x.img+'" onerror="this.outerHTML=\'<div class=face>'+x.icon+'</div>\'" alt="">':'<div class="face">'+x.icon+'</div>')+'<div>'+x.n+'</div><div class="bar"><i style="width:'+Math.max(0,x.hp/x.mhp*100)+'%;background:var(--red)"></i></div></div>').join('')+'</div>'+
   '<div class="crew" style="margin:8px 0">'+f.party.map(p=>'<div class="mem">'+(portrait(p.n)||'')+'<div class="bar"><i style="width:'+Math.max(0,p.hp/p.mhp*100)+'%"></i></div></div>').join('')+'</div><div id="log">'+f.log.slice(-8).join('<br>')+'</div>'+
   '<div class="row">'+(f.over?'<button class="go" onclick="endFight()">Continue</button>':'<button class="go" onclick="turn(\'a\')">Attack</button><button onclick="turn(\'h\')">Heal (San)</button><button onclick="turn(\'f\')">Flee</button>')+'</div>';
  const l=document.getElementById('log');l.scrollTop=l.scrollHeight}
function turn(m){
  const f=F,san=f.party[0],alive=()=>f.party.filter(p=>p.hp>0),foes=()=>f.foes.filter(x=>x.hp>0);
  if(m==='f'){if(f.boss){f.log.push('You cannot flee a boss!');return paintFight()}F=null;document.getElementById('fight').classList.remove('on');return render()}
  if(m==='h'){const h=Math.round(san.mhp*.25+(f.party.some(p=>p.n==='Eliz')?20:0));f.party.forEach(p=>{if(p.hp>0)p.hp=Math.min(p.mhp,p.hp+Math.round(h/2))});f.log.push('San rallies the party (+'+h/2+' HP each).')}
  else for(const p of alive()){const t=foes()[0];if(!t)break;let d=Math.round(p.atk*(.85+Math.random()*.3));if(p.n==='Mezstorm'&&Math.random()<.3){d*=2;f.log.push('⚡ Mezstorm calls lightning!')}t.hp-=d;f.log.push(p.n+' hits '+t.n+' for '+d)}
  if(!foes().length){f.over=true;f.win=true;const xp=f.foes.reduce((a,x)=>a+x.xp,0);f.log.push('Victory! +'+xp+' XP');gainXp(xp);if(f.boss){f.log.push('The way forward opens…')}return paintFight()}
  for(const x of foes()){const t=alive();const tg=t.find(p=>p.n==='Joel')&&Math.random()<.5?t.find(p=>p.n==='Joel'):t[Math.random()*t.length|0];const d=Math.round(x.atk*(.85+Math.random()*.3)*(tg.n==='Joel'?.7:1));tg.hp-=d;f.log.push(x.n+' hits '+tg.n+' for '+d)}
  if(!alive().length){f.over=true;f.log.push('The party falls… you retreat and recover.')}
  paintFight()}
function endFight(){const f=F;F=null;document.getElementById('fight').classList.remove('on');
  if(f.win&&f.boss){completeChapter(f.ch.id);return}  // read -> fight -> aftermath
  save();render()}
render();
</script>
</body>
</html>
