<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Daybreak: Story Journey (Prototype)</title>
<style>
:root{--bg:#0f0e17;--card:#1a1925;--hover:#252336;--border:#33304a;--text:#ece9f7;--dim:#9a96b5;--accent:#7c3aed;--accent2:#a78bfa;--gold:#e8c547;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 80px}
h1{font-family:Georgia,serif;font-size:20px;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.obj{border-color:var(--gold);background:linear-gradient(180deg,#2a2412,var(--card))}
.obj .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.obj .t{font-size:17px;font-weight:700;margin:2px 0 4px}.obj .d{font-size:13px;color:var(--dim);margin-bottom:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--hover);color:var(--text);padding:9px 14px;font-weight:600}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;background:#000;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.bar.x i{background:var(--accent2)}
.crew{display:flex;gap:8px;flex-wrap:wrap}.mem{width:64px;text-align:center;font-size:11px}
.mem img,.mem .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;background:var(--hover)}
.ch{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}.ch:first-child{border:0}
.ch .n{width:26px;color:var(--dim);font-size:12px}.ch .m{flex:1}.ch .m small{display:block;color:var(--dim)}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--border);color:var(--dim)}.tag.done{color:var(--green);border-color:var(--green)}.tag.cur{color:var(--gold);border-color:var(--gold)}
.ov{position:fixed;inset:0;z-index:50;display:none;background:#05070c;overflow:auto;padding:14px}.ov.on{display:block}
.shell{max-width:560px;margin:0 auto}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between}
.art{width:100%;max-height:44vh;object-fit:cover;border-radius:12px;border:1px solid var(--border);margin:10px 0;background:#071116}
.say{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;min-height:110px;cursor:pointer}
.say img{width:54px;height:54px;border-radius:50%;object-fit:cover;flex-shrink:0}.who{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);margin-bottom:3px}
.tap{text-align:center;color:var(--gold);font-size:12px;margin-top:10px;opacity:.8}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center}
.modal h2{margin:0 0 8px;color:var(--gold);font-family:Georgia,serif;font-size:18px}.modal p{color:var(--text);margin:0 0 14px;white-space:pre-line}
.zone{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border)}.zone.sel{background:rgba(124,58,237,.08)}.zone.lock{opacity:.5}.zi{font-size:24px;width:30px;text-align:center}.zm{flex:1;min-width:0}.zm small{display:block;color:var(--dim);font-size:11px}
.foes{display:flex;gap:8px;margin:8px 0}.foe{flex:1;text-align:center;font-size:12px}.foe .face{font-size:30px}.foe img{width:100%;max-height:110px;object-fit:cover;border-radius:10px}
#log{height:110px;overflow:auto;font-size:12px;color:var(--dim);background:#000;border-radius:8px;padding:6px;margin:8px 0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:8px 14px;border-radius:12px;z-index:90;font-size:13px;display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="story"><div class="shell" id="storyShell"></div></div>
<div class="ov" id="fight"><div class="shell" id="fightShell"></div></div>
<div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><p id="mb"></p><button class="go" onclick="closeModal()">Continue</button></div></div>
<div class="toast" id="toast"></div>
<script src="chapters.js"></script>
<script>
/* Prototype: Crimson-Tide-style story journey over Daybreak chapters 1-10.
   Loop per chapter: Objective -> (hunt to level / fight boss) -> Story Mode -> aftermath modal -> next Objective. */
const SAVE_KEY='daybreak_story_journey_proto';
const CREW={Soel:{atk:4,hp:30,role:'Spark'},Joel:{atk:9,hp:90,role:'Shield'},Aisyah:{atk:12,hp:50,role:'Blade'},Eliz:{atk:5,hp:45,role:'Healer'},Mezstorm:{atk:14,hp:55,role:'Storm'}};
const JOINS={1:'Soel',3:'Joel',4:'Aisyah',6:'Eliz',7:'Mezstorm'};
// Zones: the first ten of Daybreak's own zones (names/foes/loot from game.js), laid out so each story
// chapter sits at the END of a grind. needCh = chapter that must be complete to enter. lo-hi = recommended levels.
const ZONES=[
 {id:'woods',  n:'Whispering Woods',  icon:'🌲',lo:1, hi:4, needCh:0, ch:'Ch 1–2', foes:['Goblin','Wolf','Slime'],                 loot:['Herb Bundle','Goblin Tooth','Forest Sap']},
 {id:'caverns',n:'Crystal Caverns',   icon:'💎',lo:5, hi:7, needCh:2, ch:'Ch 3',   foes:['Crystal Spider','Gem Golem','Shimmer Bat'], loot:['Crystal Shard','Silk Thread','Gem Dust']},
 {id:'ember',  n:'Ember Peak',        icon:'🌋',lo:8, hi:11,needCh:3, ch:'Ch 4–5', foes:['Fire Imp','Lava Slug','Ash Wraith'],        loot:['Fire Essence','Obsidian','Cinder Fragment']},
 {id:'temple', n:'Sunken Temple',     icon:'🌊',lo:12,hi:13,needCh:5, ch:'Ch 6',   foes:['Drowned Sailor','Sea Serpent','Coral Golem'],loot:['Pearl','Coral Branch','Aqua Pearl']},
 {id:'storm',  n:'Stormhold',         icon:'⚡',lo:14,hi:15,needCh:6, ch:'Ch 7',   foes:['Storm Wraith','Lightning Hound','Thunder Knight'],loot:['Storm Core','Conductive Wire','Static Orb']},
 {id:'catacomb',n:'Cursed Catacombs', icon:'💀',lo:16,hi:17,needCh:7, ch:'Ch 8 · Bone Tyrant', foes:['Skeleton','Zombie','Ghost'],  loot:['Iron Ore','Bone Shard','Grave Dust']},
 {id:'frost',  n:'Frostspire Ruins',  icon:'❄️',lo:18,hi:19,needCh:8, ch:'Ch 9 · Frost Queen', foes:['Ice Elemental','Frost Wolf','Frozen Knight'],loot:['Ice Crystal','Frost Gem','Glacial Shard']},
 {id:'abyss',  n:'Abyssal Depths',    icon:'🌀',lo:20,hi:23,needCh:9, ch:'Ch 10 · Abyssal Leviathan', foes:['Void Beast','Shadow Demon','Abyssal Horror'],loot:['Void Essence','Dark Crystal','Abyssal Thread']}
];
const MASTERY=30; // kills in a zone for its mastery bonus (+10% XP & gold there)
// Chapter boss fights happen IN the zone they belong to
const BOSSES={8:{name:'Bone Tyrant',icon:'💀',zone:'catacomb',hp:2200,atk:48,xp:120},
              9:{name:'Frost Queen',icon:'❄️',img:'../bosses/frostqueen.jpg',zone:'frost',hp:3500,atk:62,xp:200},
              10:{name:'Abyssal Leviathan',icon:'🐙',img:'../bosses/abyssalleviathan.jpg',zone:'abyss',hp:4200,atk:66,xp:300}};
const NEED_LV={1:1,2:5,3:8,4:10,5:12,6:14,7:16,8:17,9:19,10:21};

const DEF={lvl:1,xp:0,gold:0,done:{},crew:[],read:{},kills:{},loot:{},gear:{atk:0,hp:0},zone:null};
let G=Object.assign({},DEF,load()||{});G.gear=Object.assign({atk:0,hp:0},G.gear);G.auto=false;
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G))}catch(e){}}
const xpN=()=>30+G.lvl*20, maxHp=()=>90+G.lvl*14+G.gear.hp*20, sanAtk=()=>8+G.lvl*2+G.gear.atk*3;
const nextCh=()=>CHAPTERS.find(c=>!G.done[c.id]);
const zoneById=id=>ZONES.find(z=>z.id===id);
const unlocked=z=>(z.needCh===0||G.done[z.needCh])&&G.lvl>=z.lo-1;
const recZone=()=>[...ZONES].reverse().find(z=>unlocked(z)&&G.lvl>=z.lo)||ZONES[0];
const huntZone=()=>{const z=zoneById(G.zone);return z&&unlocked(z)?z:recZone()};
const xpMult=z=>(G.lvl>z.hi?Math.max(.2,1-(G.lvl-z.hi)*.25):1)*((G.kills[z.id]||0)>=MASTERY?1.1:1);
const portrait=n=>n==='Narrator'?'':'<img src="../portraits/'+(n==='San'?'san':n.toLowerCase().replace(/[\s.]/g,''))+'.jpg" onerror="this.remove()" alt="">';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

/* ---------- Objective: single source of truth for "what next" ---------- */
function objective(){
  const c=nextCh(); if(!c) return {kind:'end',title:'Chapters 1–10 complete',desc:'The prototype ends here. Keep grinding zones if you like. Crew: '+(G.crew.join(', ')||'—')+'.'};
  const bz=BOSSES[c.id]&&zoneById(BOSSES[c.id].zone);
  if(G.lvl<NEED_LV[c.id]){const z=huntZone();return {kind:'level',ch:c,title:'Reach Level '+NEED_LV[c.id],desc:'Grind in '+z.icon+' '+z.n+' (Lv '+z.lo+'–'+z.hi+') to ready yourself for Chapter '+c.id+': '+c.title+'.',btn:'Hunt '+z.n}}
  if(BOSSES[c.id]&&!G.read[c.id]) return {kind:'read',ch:c,title:'Chapter '+c.id+': '+c.title,desc:c.summary,btn:'Read story'};
  if(BOSSES[c.id]) return {kind:'boss',ch:c,title:'Face the '+BOSSES[c.id].name,desc:'Fight in '+bz.icon+' '+bz.n+'.',btn:'Fight '+BOSSES[c.id].name};
  return {kind:'read',ch:c,title:'Chapter '+c.id+': '+c.title,desc:c.summary,btn:'Read story'};
}

/* ---------- Home ---------- */
const shopCost=k=>Math.round(40*Math.pow(1.45,G.gear[k]));
const lootValue=()=>Object.entries(G.loot).reduce((a,[n,q])=>{const zi=ZONES.findIndex(z=>z.loot.includes(n));return a+q*(4+zi*3)},0);
function render(){
  const o=objective(),a=document.getElementById('app'),hz=huntZone();
  let h='<h1>Legends of Daybreak</h1><div class="sub">Story Journey · prototype · chapters 1–10</div>';
  h+='<div class="panel obj"><div class="k">Objective</div><div class="t">'+o.title+'</div><div class="d">'+o.desc+'</div>';
  if(o.btn)h+='<div class="row"><button class="go" onclick="act()">'+o.btn+'</button>'+(o.kind==='level'?'<button onclick="startAuto()">⏩ Auto-hunt</button>':'')+'</div>';
  h+='</div>';
  h+='<div class="panel"><div class="row" style="justify-content:space-between"><b>San · Lv '+G.lvl+'</b><span class="sub" style="margin:0">💰 '+G.gold+' · '+G.xp+' / '+xpN()+' XP</span></div><div class="bar x" style="margin:6px 0 10px"><i style="width:'+(G.xp/xpN()*100)+'%"></i></div><div class="crew">'+
    ['San'].concat(G.crew).map(n=>'<div class="mem">'+(portrait(n)||'')+'<div>'+n+'</div></div>').join('')+'</div></div>';
  // Zones
  h+='<div class="panel"><b>Zones</b><div class="sub" style="text-align:left;margin:2px 0 6px">Grind where your level fits. Story chapters unlock deeper zones.</div>';
  for(const z of ZONES){const ok=unlocked(z),k=G.kills[z.id]||0,m=k>=MASTERY,rec=ok&&recZone()===z,sel=ok&&hz===z;
    h+='<div class="zone'+(ok?'':' lock')+(sel?' sel':'')+'"><div class="zi">'+(ok?z.icon:'🔒')+'</div><div class="zm"><div><b>'+z.n+'</b> <span class="tag">Lv '+z.lo+(z.hi>z.lo?'–'+z.hi:'')+'</span>'+(rec?' <span class="tag cur">Recommended</span>':'')+(m?' <span class="tag done">★ Mastered</span>':'')+'</div>'+
     '<small>'+(ok?z.foes.join(' · ')+' · '+z.ch:(G.done[z.needCh]||z.needCh===0?'Reach Lv '+(z.lo-1):'Complete Chapter '+z.needCh+' to enter'))+'</small>'+
     (ok?'<div class="bar x" style="margin-top:4px"><i style="width:'+Math.min(100,k/MASTERY*100)+'%"></i></div><small>'+k+' / '+MASTERY+' kills'+(m?'':' to mastery (+10% XP & gold)')+(G.lv>z.hi?'':'')+(G.lvl>z.hi?' · over-leveled: '+Math.round(xpMult(z)*100)+'% XP':'')+'</small>':'')+'</div>'+
     (ok?'<button '+(sel?'class="go"':'')+' onclick="pickZone(\''+z.id+'\')">'+(sel?'Hunt':'Hunt')+'</button>':'')+'</div>';}
  h+='</div>';
  // Gear + loot
  const lq=Object.values(G.loot).reduce((a,b)=>a+b,0);
  h+='<div class="panel"><b>Camp</b><div class="row" style="margin-top:8px">'+
    '<button onclick="buy(\'atk\')" '+(G.gold<shopCost('atk')?'disabled':'')+'>🗡️ Whetstone +3 ATK · 💰'+shopCost('atk')+' (lv '+G.gear.atk+')</button>'+
    '<button onclick="buy(\'hp\')" '+(G.gold<shopCost('hp')?'disabled':'')+'>🛡️ Padding +20 HP · 💰'+shopCost('hp')+' (lv '+G.gear.hp+')</button>'+
    '<button onclick="sellLoot()" '+(lq?'':'disabled')+'>🎒 Sell loot ('+lq+') · 💰'+lootValue()+'</button></div></div>';
  h+='<div class="panel"><b>Story</b>';
  for(const c of CHAPTERS){const d=G.done[c.id],cur=nextCh()===c;
    h+='<div class="ch"><div class="n">'+c.id+'</div><div class="m">'+c.icon+' '+c.title+'<small>'+(d?'Complete':cur?'Current':'Locked')+'</small></div>'+
      (d?'<button onclick="openStory('+c.id+',true)">Replay</button>':'<span class="tag '+(cur?'cur':'')+'">'+(cur?'Next':'🔒')+'</span>')+'</div>';}
  h+='</div><div style="text-align:center"><button onclick="if(confirm(\'Reset prototype save?\')){localStorage.removeItem(SAVE_KEY);location.reload()}">Reset</button></div>';
  a.innerHTML=h;
}
function pickZone(id){G.zone=id;save();startFight(false)}
function buy(k){const c=shopCost(k);if(G.gold<c)return;G.gold-=c;G.gear[k]++;save();render();toast('Upgraded')}
function sellLoot(){const v=lootValue();G.gold+=v;G.loot={};save();render();toast('Sold loot for 💰'+v)}
function act(){const o=objective();
  if(o.kind==='level')startFight(false); else if(o.kind==='boss')startFight(true); else if(o.kind==='read')openStory(o.ch.id,false);}

/* ---------- Story Mode (full-screen, tap to advance) ---------- */
let S=null;
function openStory(id,replay){S={c:CHAPTERS.find(c=>c.id===id),i:0,replay};document.getElementById('story').classList.add('on');paintStory()}
function paintStory(){
  const c=S.c,s=c.scenes[S.i],last=S.i===c.scenes.length-1;
  document.getElementById('storyShell').innerHTML='<div class="kick"><span>Chapter '+c.id+' · '+c.title+'</span><span>'+(S.i+1)+' / '+c.scenes.length+'</span></div>'+
   (c.art?'<img class="art" src="../story-art/'+c.art+'" onerror="this.remove()" alt="">':'')+
   '<div class="say" onclick="advStory()">'+portrait(s.speaker)+'<div><div class="who">'+s.speaker+'</div><div>'+s.text+'</div></div></div>'+
   '<div class="tap">'+(last?'Tap to finish':'Tap to continue ▸')+'</div><div class="row" style="justify-content:center;margin-top:12px"><button onclick="closeStory()">Close</button></div>';
  scrollTo(0,0);
}
function advStory(){if(S.i<S.c.scenes.length-1){S.i++;paintStory();return}
  const id=S.c.id,rep=S.replay;closeStory();if(rep)return;
  if(BOSSES[id]&&!G.read?.[id]){G.read=G.read||{};G.read[id]=true;save();render();toast('Story read — the fight awaits');return}
  completeChapter(id)}
function closeStory(){document.getElementById('story').classList.remove('on');S=null;render()}

/* ---------- Modal queue (aftermath, recruits, level-ups play one after another) ---------- */
const Q=[];let modalOpen=false;
function queue(t,b){Q.push([t,b]);if(!modalOpen)nextModal()}
function nextModal(){const m=Q.shift();if(!m){modalOpen=false;return}modalOpen=true;mt.textContent=m[0];mb.textContent=m[1];document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on');setTimeout(nextModal,200)}

function gainXp(x){G.xp+=x;let ups=0;while(G.xp>=xpN()){G.xp-=xpN();G.lvl++;ups++}
  if(ups){if(G.auto)toast('⬆️ Level '+G.lvl);else queue('Level Up!','San is now Level '+G.lvl+'.')}}
function completeChapter(id){
  const c=CHAPTERS.find(x=>x.id===id);G.done[id]=true;
  const bossXp=BOSSES[id]?0:30+id*10;gainXp(bossXp);
  const j=JOINS[id];let txt='Chapter '+id+' complete.'+(bossXp?'\n+'+bossXp+' XP':'');
  queue(c.title,txt);
  if(j&&!G.crew.includes(j)){G.crew.push(j);queue(j+' joins your crew!',CREW[j].role+' · ATK '+CREW[j].atk+' · HP '+CREW[j].hp)}
  const n=nextCh();queue('New Objective',n?'Next: Chapter '+n.id+' — '+n.title:'You have reached the end of the prototype.');
  save();render()}

/* ---------- Fight: grind waves in a zone, or a chapter boss ---------- */
let F=null,autoT=null;
function startFight(boss){
  const o=objective();let foes,z;
  if(boss){const b=BOSSES[o.ch.id];z=zoneById(b.zone);foes=[{n:b.name,icon:b.icon,img:b.img,hp:b.hp,mhp:b.hp,atk:b.atk,xp:b.xp,gold:60+o.ch.id*20,boss:true}]}
  else{z=huntZone();const L=Math.min(Math.max(G.lvl,z.lo),z.hi),m=xpMult(z);
    foes=[0,1,2].map(()=>{const hp=Math.round(18+L*8);return{n:z.foes[Math.random()*3|0],icon:'👹',hp,mhp:hp,atk:2.5+L*1.0,xp:Math.max(1,Math.round((3+L*.5)*m)),gold:Math.round((4+L*1.5)*m)}})}
  const party=[{n:'San',hp:maxHp(),mhp:maxHp(),atk:sanAtk()}].concat(G.crew.map(n=>({n,hp:CREW[n].hp+G.lvl*4,mhp:CREW[n].hp+G.lvl*4,atk:CREW[n].atk+G.lvl})));
  F={foes,party,boss,z,ch:o.ch,log:['Battle begins in '+z.n+'!'],over:false};document.getElementById('fight').classList.add('on');paintFight();
  if(G.auto&&!boss)autoT=setTimeout(autoStep,350)}
function startAuto(){G.auto=true;startFight(false)}
function stopAuto(){G.auto=false;clearTimeout(autoT)}
function paintFight(){
  const f=F;document.getElementById('fightShell').innerHTML='<div class="kick"><span>'+(f.boss?'Boss Battle':G.auto?'Auto-hunt':'Hunt')+'</span><span>'+f.z.icon+' '+f.z.n+'</span></div>'+
   '<div class="foes">'+f.foes.map(x=>'<div class="foe">'+(x.img?'<img src="'+x.img+'" onerror="this.outerHTML=\'<div class=face>'+x.icon+'</div>\'" alt="">':'<div class="face">'+x.icon+'</div>')+'<div>'+x.n+'</div><div class="bar"><i style="width:'+Math.max(0,x.hp/x.mhp*100)+'%;background:var(--red)"></i></div></div>').join('')+'</div>'+
   '<div class="crew" style="margin:8px 0">'+f.party.map(p=>'<div class="mem">'+(portrait(p.n)||'')+'<div class="bar"><i style="width:'+Math.max(0,p.hp/p.mhp*100)+'%"></i></div></div>').join('')+'</div><div id="log">'+f.log.slice(-8).join('<br>')+'</div>'+
   '<div class="row">'+(G.auto&&!f.over?'<button class="go" onclick="stopAuto();paintFight()">⏹ Stop auto</button>':f.over?'<button class="go" onclick="endFight()">Continue</button>':'<button class="go" onclick="turn(\'a\')">Attack</button><button onclick="turn(\'h\')">Rally (heal + revive)</button><button onclick="turn(\'f\')">Flee</button>')+'</div>';
  const l=document.getElementById('log');l.scrollTop=l.scrollHeight}
function turn(m){
  const f=F,san=f.party[0],alive=()=>f.party.filter(p=>p.hp>0),foes=()=>f.foes.filter(x=>x.hp>0);
  if(m==='f'){if(f.boss){f.log.push('You cannot flee a boss!');return paintFight()}stopAuto();F=null;document.getElementById('fight').classList.remove('on');return render()}
  if(m==='h'){const h=Math.round(san.mhp*.25+(f.party.some(p=>p.n==='Eliz')?20:0));f.party.forEach(p=>{if(p.hp>0)p.hp=Math.min(p.mhp,p.hp+Math.round(h/2));else{p.hp=Math.round(p.mhp*.25);f.log.push(p.n+' gets back up!')}});f.log.push('San rallies the party (+'+Math.round(h/2)+' HP each).')}
  else for(const p of alive()){const t=foes()[0];if(!t)break;let d=Math.round(p.atk*(.85+Math.random()*.3));if(p.n==='Mezstorm'&&Math.random()<.3){d*=2;f.log.push('⚡ Mezstorm calls lightning!')}t.hp-=d;f.log.push(p.n+' hits '+t.n+' for '+d)}
  if(!foes().length){f.over=true;f.win=true;
    const xp=f.foes.reduce((a,x)=>a+x.xp,0),gold=f.foes.reduce((a,x)=>a+x.gold,0);f.log.push('Victory! +'+xp+' XP, +'+gold+' gold');G.gold+=gold;
    if(!f.boss){G.kills[f.z.id]=(G.kills[f.z.id]||0)+f.foes.length;
      for(const x of f.foes)if(Math.random()<.35){const it=f.z.loot[Math.random()*3|0];G.loot[it]=(G.loot[it]||0)+1;f.log.push('Loot: '+it)}
      if(G.kills[f.z.id]>=MASTERY&&G.kills[f.z.id]-f.foes.length<MASTERY){f.log.push('★ '+f.z.n+' mastered! +10% XP & gold here.');queue('Zone Mastered!',f.z.n+'\n+10% XP & gold from this zone.')}}
    gainXp(xp);if(f.boss)f.log.push('The way forward opens…');return paintFight()}
  for(const x of foes()){const t=alive();if(!t.length)break;const tg=t.find(p=>p.n==='Joel')&&Math.random()<.5?t.find(p=>p.n==='Joel'):t[Math.random()*t.length|0];const d=Math.round(x.atk*(.85+Math.random()*.3)*(tg.n==='Joel'?.7:1));tg.hp-=d;f.log.push(x.n+' hits '+tg.n+' for '+d)}
  if(!alive().length){f.over=true;stopAuto();f.log.push('The party falls… you retreat and recover.')}
  paintFight()}
function autoStep(){
  if(!G.auto||!F)return;
  if(F.over){
    if(!F.win){return}                                   // loss: stopAuto already ran; player taps Continue
    F=null;document.getElementById('fight').classList.remove('on');save();render();
    if(objective().kind!=='level'){stopAuto();toast('Objective ready!');return}
    autoT=setTimeout(()=>{if(G.auto)startFight(false)},500);return}
  const low=F.party.reduce((a,p)=>a+p.hp/p.mhp,0)/F.party.length;
  turn(low<.4&&Math.random()<.6?'h':'a');
  if(G.auto||F&&F.over)autoT=setTimeout(autoStep,F&&F.over?500:300)}
function endFight(){const f=F;F=null;document.getElementById('fight').classList.remove('on');
  if(f.win&&f.boss){completeChapter(f.ch.id);return}  // read -> fight -> aftermath
  save();render()}
render();
</script>
